[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobfinder"
version = "0.7.0"
description = "Local job-search assistant: collects Bavarian job postings and explains them in English"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "llmpool @ git+https://github.com/MiladBahariQaragoz/FreeLLMPool.git",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # Build-time only: what turns this checkout into the one file she
    # double-clicks. Never a runtime dependency of the app (Phase 10).
    "pyinstaller>=6.0",
    "ruff>=0.6",
    "httpx>=0.27",
    "httpx2>=2.0",
    "playwright>=1.40",
]

[project.scripts]
jobfinder = "jobfinder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live: hits the real internet; run with `pytest -m live`",
    "live_llm: spends a real LLM call; run with `pytest -m live_llm`",
]
addopts = "-m 'not live and not live_llm'"
# "pytest green, no warnings" is in every phase's Definition of Done, so a warning
# fails the run rather than scrolling past. Unclosed SQLite connections hid here.
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
